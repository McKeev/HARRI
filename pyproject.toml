[project]
name = "harri"
version = "0.1.0"
description = ""
authors = [
    {name = "Cedric McKeever",email = "cedricmckeever@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fin-db @ file:///Users/cedricmckeever/projects/fin_db",
    "pydantic-ai (>=1.82.0,<2.0.0)",
    "pandas (<3.0.0)",
    "pydantic (>=2.13.1,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)"
]

[tool.poetry]
packages = [{include = "harri", from = "src"}]

[tool.poetry.dependencies]
fin-db = {develop = true}
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
harri = "harri.main:run"

[dependency-groups]
optional = [
    "logfire (>=4.32.1,<5.0.0)"
]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
